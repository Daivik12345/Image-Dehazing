[project]
name = "btp"
version = "0.1.0"
description = "Live, small-scale hazing-to-dehazing experiments"
readme = "README.md"
authors = [
    { name = "Daivik Gupta", email = "g.daivik@iitg.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=10",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.12",
    "streamlit>=1.40",
]

[project.scripts]
btp = "btp.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "btp"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["upstream"]

[tool.ruff.lint.per-file-ignores]
"src/btp/paper.py" = ["E402"]
"src/btp/experiment.py" = ["UP017"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
